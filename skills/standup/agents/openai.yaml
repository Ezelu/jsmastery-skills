# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Standup"
  short_description: "Print where the work stands, read only"
  default_prompt: "Run the standup skill: read its SKILL.md, then print one screen on what moved in git, which scope features are in-progress or blocked, and which specs still owe a decision."
